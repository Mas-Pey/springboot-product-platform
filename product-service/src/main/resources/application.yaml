spring:
  application:
    name: product-service
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springboot}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6370
  cache:
    type: redis

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

dummyjson:
  url: https://dummyjson.com

minio:
  url: http://localhost:9000
  access:
    name: ${MINIO_USER:}
    secret: ${MINIO_PASSWORD:}
  bucket:
    name: product-report
  presigned-expiry-minutes: 2

report:
  scheduler:
    cron: "0 */2 * * * *"
